name: CI

# PLA-I2-15 in the devva fork. Plania keeps its data in a devva engine that runs in Docker (deploy/devva/),
# and GitHub's hosted runners have Docker on Linux only, so:
#   - the build (both type-checks, then the screen) runs on macOS and Linux on every change;
#   - the tests and the canary run on Linux, against an engine this workflow starts.
# The engine's image is not public. The repository variable DEVVA_IMAGE names one the runner can pull; on ghcr.io the
# workflow's own token signs in. Without it the test jobs warn that they did not run and stop there; the build still
# runs. Pull requests, and pushes to main.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request replaces its run; runs on a branch always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # Pulls the engine's image from ghcr.io.
  packages: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up pnpm
        # Reads the version from "packageManager" in package.json.
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Both type-checks, then the screen into dist/ui, as a release does.
      - name: Build
        run: pnpm build

  test:
    name: Tests (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      DEVVA_IMAGE: ${{ vars.DEVVA_IMAGE }}
      # The engine this job starts. The tests write to lobes of their own (t_*, test/helpers.ts), never plania.
      DEVVA_HOST: 127.0.0.1
      DEVVA_PORT: "2505"
      DEVVA_TOKEN_FILE: ${{ github.workspace }}/../devva-token
      # Tests of a product's own Postgres (test copies, the Máquina inventory) connect to localhost:5432 with no
      # password as this role and make and drop their own throwaway databases. Never a database named plania.
      PLANIA_TEST_PGUSER: postgres

    steps:
      - name: Engine image
        id: image
        run: |
          if [ -z "$DEVVA_IMAGE" ]; then
            echo "::warning::The tests did not run: set the repository variable DEVVA_IMAGE to a devva engine image this runner can pull (deploy/devva/README.md)."
            echo "ready=0" >> "$GITHUB_OUTPUT"
          else
            echo "ready=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out
        if: steps.image.outputs.ready == '1'
        uses: actions/checkout@v4

      # The same engine and flags as deploy/devva/compose.yml, with a token made for this run.
      - name: Devva engine
        if: steps.image.outputs.ready == '1'
        run: |
          case "$DEVVA_IMAGE" in ghcr.io/*) echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin ;; esac
          # A throwaway token for an engine bound to this runner's loopback; readable by the container's user.
          od -An -tx1 -N24 /dev/urandom | tr -d ' \n' > "$DEVVA_TOKEN_FILE"
          docker run -d --name devva-engine -p "127.0.0.1:${DEVVA_PORT}:2505" \
            -v "$DEVVA_TOKEN_FILE:/run/secrets/devva-token:ro" \
            "$DEVVA_IMAGE" --port 2505 --path /data/devva --bind 0.0.0.0 --auth-token /run/secrets/devva-token --durability durable
          for i in $(seq 1 60); do (exec 3<>"/dev/tcp/127.0.0.1/${DEVVA_PORT}") 2>/dev/null && break; sleep 1; done
          (exec 3<>"/dev/tcp/127.0.0.1/${DEVVA_PORT}") 2>/dev/null || { docker logs devva-engine; echo "::error::the devva engine did not answer"; exit 1; }

      # The distribution's Postgres, for the tests of a product's own database (they skip when none answers).
      - name: Postgres
        if: steps.image.outputs.ready == '1'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql
          sudo systemctl start postgresql.service
          for i in $(seq 1 30); do pg_isready -h localhost -p 5432 && break; sleep 1; done
          hba=$(sudo -u postgres psql -tAc "show hba_file")
          # Trust TCP connections from this machine only, ahead of the packaged password rules.
          sudo sed -i '1i host all all ::1/128 trust' "$hba"
          sudo sed -i '1i host all all 127.0.0.1/32 trust' "$hba"
          sudo -u postgres psql -tAc "select pg_reload_conf()"

      - name: Set up pnpm
        if: steps.image.outputs.ready == '1'
        uses: pnpm/action-setup@v4

      - name: Set up Node
        if: steps.image.outputs.ready == '1'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        if: steps.image.outputs.ready == '1'
        run: pnpm install --frozen-lockfile

      - name: Git identity for tests that commit
        if: steps.image.outputs.ready == '1'
        run: |
          git config --global user.name "plania-ci"
          git config --global user.email "ci@plania.invalid"
          git config --global init.defaultBranch main

      # The suite as `pnpm test` runs it, with a second, TAP copy of the results for the skip list below.
      # The clean-install test (test/clean-install.test.ts) is part of it. PLA-I74-2: the canary runs in its own job
      # (below), so it is left out here and never runs twice.
      - name: Test
        if: steps.image.outputs.ready == '1'
        run: |
          files=()
          for f in test/*.test.ts; do [ "$f" = test/canary.test.ts ] || files+=("$f"); done
          node --import tsx --test --test-concurrency=1 --test-force-exit --test-timeout=300000 \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=tap --test-reporter-destination=test-results.tap \
            "${files[@]}"

      # Every skipped test with its reason (test/platform.ts says why a test cannot run on this system).
      - name: Skipped tests
        if: always() && steps.image.outputs.ready == '1'
        run: |
          echo "Skipped on ubuntu-latest:"
          if [ -f test-results.tap ]; then
            grep -E "# SKIP" test-results.tap | sed -E 's/^[[:space:]]*(not )?ok [0-9]+ - //' || echo "none"
          else
            echo "no test results (the suite did not run)"
          fi

      - name: The engine's log
        if: failure() && steps.image.outputs.ready == '1'
        run: docker logs --tail 100 devva-engine || true

  # PLA-I74-2: the canary. One owner request from Pedir to production through the real API, runner, heartbeat, QA lane,
  # El Probador and the GitHub and deploy pollers, with every outside call faked (test/canary.test.ts). Its own job so
  # its result is one named check that can be made required, and so a broken handoff reads as "Canary" and not as one
  # of 350 test files. A scenario row still waiting on its fix is a todo naming that ticket: it shows, it does not fail.
  canary:
    name: Canary (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DEVVA_IMAGE: ${{ vars.DEVVA_IMAGE }}
      DEVVA_HOST: 127.0.0.1
      DEVVA_PORT: "2505"
      DEVVA_TOKEN_FILE: ${{ github.workspace }}/../devva-token

    steps:
      - name: Engine image
        id: image
        run: |
          if [ -z "$DEVVA_IMAGE" ]; then
            echo "::warning::The canary did not run: set the repository variable DEVVA_IMAGE to a devva engine image this runner can pull (deploy/devva/README.md)."
            echo "ready=0" >> "$GITHUB_OUTPUT"
          else
            echo "ready=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out
        if: steps.image.outputs.ready == '1'
        uses: actions/checkout@v4

      - name: Devva engine
        if: steps.image.outputs.ready == '1'
        run: |
          case "$DEVVA_IMAGE" in ghcr.io/*) echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin ;; esac
          # A throwaway token for an engine bound to this runner's loopback; readable by the container's user.
          od -An -tx1 -N24 /dev/urandom | tr -d ' \n' > "$DEVVA_TOKEN_FILE"
          docker run -d --name devva-engine -p "127.0.0.1:${DEVVA_PORT}:2505" \
            -v "$DEVVA_TOKEN_FILE:/run/secrets/devva-token:ro" \
            "$DEVVA_IMAGE" --port 2505 --path /data/devva --bind 0.0.0.0 --auth-token /run/secrets/devva-token --durability durable
          for i in $(seq 1 60); do (exec 3<>"/dev/tcp/127.0.0.1/${DEVVA_PORT}") 2>/dev/null && break; sleep 1; done
          (exec 3<>"/dev/tcp/127.0.0.1/${DEVVA_PORT}") 2>/dev/null || { docker logs devva-engine; echo "::error::the devva engine did not answer"; exit 1; }

      - name: Set up pnpm
        if: steps.image.outputs.ready == '1'
        uses: pnpm/action-setup@v4

      - name: Set up Node
        if: steps.image.outputs.ready == '1'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        if: steps.image.outputs.ready == '1'
        run: pnpm install --frozen-lockfile

      # The fixture app's repos commit and merge with real git (test/canary/fixture.ts, fake-github.ts).
      - name: Git identity for the fixture repos
        if: steps.image.outputs.ready == '1'
        run: |
          git config --global user.name "plania-ci"
          git config --global user.email "ci@plania.invalid"
          git config --global init.defaultBranch main

      # Under five minutes is the bar (PLA-I74-2); the job's timeout is the ceiling, not the target.
      - name: Canary
        if: steps.image.outputs.ready == '1'
        run: >-
          node --import tsx --test --test-force-exit --test-timeout=300000
          --test-reporter=spec --test-reporter-destination=stdout
          test/canary.test.ts
