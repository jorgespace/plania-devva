name: Install from zero

# PLA-I2-4 (from zero) in the devva fork: the release package installed by the real one-line installer, the
# way a person with a new computer runs it: --from the packed archive, --yes (no questions), --no-open. Plania keeps its
# data in a devva engine that runs in Docker, and the installer starts it from the package's compose file. GitHub's
# hosted runners run Linux containers on Linux only (macOS runners have no Docker; Windows runners run Windows
# containers), so this job runs on Linux; macOS and Windows are checked by hand (docs/releasing.md). The engine's image
# is not public: the repository variable DEVVA_IMAGE names one the runner can pull (on ghcr.io the workflow's token
# signs in). Without it the job warns that it did not run. Then Plania must answer on localhost:3737, serve the
# first-start page, and leave with `pnpm uninstall:plania --delete-data`.
# Claude Code is not installed or signed in here: the install goes on without it and names it at the end, as it does
# for a person. A macOS runner has 7 GB of memory, under the 8 Plania asks for: PLANIA_UNSUPPORTED_SKIP_CHECK=memory
# lets the gate pass that one item. It is for this job only and unsupported for users.
on:
  push:
    branches: ["jl/**"]
  pull_request:
    paths:
      - "scripts/bootstrap/**"
      - "scripts/install.ts"
      - "scripts/uninstall.ts"
      - "scripts/release-pack.ts"
      - "src/install/**"
      - "src/packaging/**"
      - "src/machine-check/**"
      - "src/uninstall/**"
      - ".github/workflows/install.yml"
  workflow_dispatch:
  # The release workflow runs this before it publishes.
  workflow_call:

concurrency:
  group: install-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

permissions:
  contents: read
  # Pulls the engine's image from ghcr.io.
  packages: read

jobs:
  pack:
    name: Pack the release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm release:pack
        run: pnpm release:pack
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            release/plania-*.tar.gz
            release/plania-*.tar.gz.sha256
            release/install.sh
            release/install.ps1
          if-no-files-found: error
          retention-days: 7

  install:
    name: Install from zero (${{ matrix.os }})
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PLANIA_UNSUPPORTED_SKIP_CHECK: memory
      # The installer's `docker compose up` reads it (deploy/devva/compose.yml).
      DEVVA_IMAGE: ${{ vars.DEVVA_IMAGE }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Engine image
        id: image
        run: |
          if [ -z "$DEVVA_IMAGE" ]; then
            echo "::warning::The install from zero did not run: set the repository variable DEVVA_IMAGE to a devva engine image this runner can pull (deploy/devva/README.md)."
            echo "ready=0" >> "$GITHUB_OUTPUT"
          else
            echo "ready=1" >> "$GITHUB_OUTPUT"
          fi

      # No checkout: the runner gets only what a person downloads.
      - uses: actions/download-artifact@v4
        if: steps.image.outputs.ready == '1'
        with:
          name: release
          path: ${{ runner.temp }}/release

      - name: What the runner has before
        if: steps.image.outputs.ready == '1'
        run: |
          node --version || echo "no node"
          git --version || echo "no git"
          docker --version || echo "no docker"
          (exec 3<>/dev/tcp/127.0.0.1/2505) 2>/dev/null && echo "something answers on 2505" || echo "nothing on 2505"

      # A person's desktop session runs user services; the runner's user gets one the same way. The engine's image is
      # pulled ahead so the installer's `docker compose up` finds it (a person's machine has it from Docker's registry).
      - name: Prepare the runner
        if: steps.image.outputs.ready == '1'
        run: |
          sudo loginctl enable-linger "$USER"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          case "$DEVVA_IMAGE" in ghcr.io/*) echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin ;; esac
          docker pull "$DEVVA_IMAGE"
      - name: Nothing answers on 2505
        if: steps.image.outputs.ready == '1'
        run: |
          if (exec 3<>/dev/tcp/127.0.0.1/2505) 2>/dev/null; then echo "::error::something already answers on 2505"; exit 1; fi

      - name: Install (macOS, Linux)
        if: steps.image.outputs.ready == '1' && runner.os != 'Windows'
        run: |
          cd "$RUNNER_TEMP/release"
          archive="$(ls plania-*.tar.gz | grep -v latest | head -n 1)"
          sh ./install.sh --from "$archive" --yes --no-open
      - name: Install (Windows)
        if: steps.image.outputs.ready == '1' && runner.os == 'Windows'
        # Windows PowerShell 5.1, what a person's machine has.
        shell: powershell
        run: |
          $archive = Get-ChildItem "$env:RUNNER_TEMP\release\plania-*.tar.gz" | Where-Object { $_.Name -notlike '*latest*' } | Select-Object -First 1
          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:RUNNER_TEMP\release\install.ps1" -From $archive.FullName -Yes -NoOpen
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Plania answers
        if: steps.image.outputs.ready == '1'
        run: |
          curl -fsS --retry 30 --retry-delay 2 --retry-all-errors http://localhost:3737/health/ui
          echo
          page="$(curl -fsS http://localhost:3737/primer-arranque)"
          echo "$page" | grep -qi '<div id="root"\|<html' || { echo "::error::/primer-arranque did not serve the screen"; echo "$page" | head -n 20; exit 1; }
          echo "/primer-arranque serves the screen"
          grep -q '^PLANIA_DEVVA_PREFIX=' ~/plania/.env

      - name: The server's log
        if: failure() && steps.image.outputs.ready == '1'
        run: |
          docker ps -a || true
          for c in $(docker ps -aq --filter name=engine); do docker logs --tail 100 "$c" || true; done
          for f in ~/.local/state/plania/server.log ~/Library/Logs/plania/server.log "$LOCALAPPDATA/plania/logs/server.log"; do
            [ -f "$f" ] && { echo "== $f"; tail -n 100 "$f"; }
          done
          if [ "$RUNNER_OS" = Linux ]; then systemctl --user status plania --no-pager || true; journalctl --user -n 50 --no-pager || true; fi
          true

      - name: pnpm uninstall:plania --delete-data
        if: steps.image.outputs.ready == '1'
        run: |
          cd ~/plania
          want="$(node -p 'require("./package.json").packageManager.replace(/^pnpm@/, "").replace(/\+.*$/, "")')"
          if command -v pnpm >/dev/null && [ "$(pnpm --version)" = "$want" ]; then pnpm=pnpm; else pnpm="npx --yes pnpm@$want"; fi
          # It asks for the store's name before it empties anything; the engine and its empty lobes stay.
          echo plania | $pnpm uninstall:plania --delete-data
          if curl -fsS --max-time 3 http://localhost:3737/health >/dev/null 2>&1; then echo "::error::Plania still answers after uninstall"; exit 1; fi
          echo "Plania is gone"
